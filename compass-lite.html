<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compass Lite</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap">
<style>
/* SpecNav brand: navy #001A3A, red #BD1924. Light and dark themes. Layout follows the Compass Lite Dashboard Demo. */
:root{
  --navy:#001A3A; --navy2:#0B2A52; --blue:#00457A; --red:#BD1924; --brand:#BD1924;
  --bg:#F5F5F3; --surface:#FFFFFF; --surface2:#FAFAF8; --line:#E2E1DD;
  --ink:#1B1F27; --ink2:#464B56; --mute:#5F6470;
  --good:#22694B; --good-t:#E3F1EA; --warn:#7A5500; --warn-t:#FBF0D9; --crit:#A8151F; --crit-t:#FBE6E7; --info:#00457A; --info-t:#E3EDF5; --idle-t:#EEEEEC;
  --shadow:0 1px 2px rgba(16,20,30,.05),0 4px 14px rgba(16,20,30,.06);
  --serif:'Playfair Display',Georgia,serif; --sans:'Inter',system-ui,-apple-system,sans-serif; --label:'Montserrat','Inter',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1117; --surface:#161B23; --surface2:#1B212B; --line:#2A313D; --ink:#ECEEF2; --ink2:#C4C9D2; --mute:#9DA3AE;
  --good:#5CC795; --good-t:#112820; --warn:#E0B24A; --warn-t:#2B2210; --crit:#FF8A92; --crit-t:#2D1519; --info:#8CC0EC; --info-t:#112133; --idle-t:#212631; --blue:#8CC0EC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1117; --surface:#161B23; --surface2:#1B212B; --line:#2A313D; --ink:#ECEEF2; --ink2:#C4C9D2; --mute:#9DA3AE;
  --good:#5CC795; --good-t:#112820; --warn:#E0B24A; --warn-t:#2B2210; --crit:#FF8A92; --crit-t:#2D1519; --info:#8CC0EC; --info-t:#112133; --idle-t:#212631; --blue:#8CC0EC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);padding:16px 16px 48px}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.top{background:var(--navy);color:#fff;border-radius:12px;padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;box-shadow:var(--shadow);border-bottom:4px solid var(--brand)}
.brandrow{display:flex;gap:12px;align-items:center;min-width:0}
.brandrow img{max-height:40px;max-width:120px;border-radius:6px;background:#fff;padding:2px}
.top h1{font:700 21px var(--serif);margin:0}
.top .sub{font:500 11px var(--label);letter-spacing:.06em;text-transform:uppercase;color:#C9D4E5;margin-top:3px;overflow-wrap:anywhere}
.topright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font:600 11px var(--label);letter-spacing:.04em;padding:4px 10px;border-radius:99px;background:#E3F1EA;color:#1D5E42;white-space:nowrap}
.chip.saving{background:#E3EDF5;color:#00457A}.chip.failed,.chip.none{background:#FBE6E7;color:#A8151F}
.pilot{font:700 10.5px var(--label);letter-spacing:.08em;padding:4px 10px;border-radius:6px;background:#FBF0D9;color:#6B4A00}
.banner{border-radius:10px;padding:10px 14px;font-size:13.5px;border:1px solid}
.banner.crit{background:var(--crit-t);color:var(--crit);border-color:var(--crit)}
.banner.info{background:var(--info-t);color:var(--info);border-color:transparent}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{font:600 12px var(--label);letter-spacing:.03em;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:10px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--red)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h2{font:700 19px var(--serif);margin:0 0 4px}
h3{font:600 12px var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
h4{font:600 13.5px var(--label);margin:0 0 6px}
summary{cursor:pointer;min-height:24px;padding:3px 0}
.lede{color:var(--ink2);margin:0 0 14px;max-width:72ch}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card.plain{box-shadow:var(--shadow)}
.card.warnb{border-color:var(--warn)} .card.critb{border-color:var(--crit)}
.card.guide{border-left:4px solid var(--navy)}
.pill{display:inline-block;font:600 10.5px var(--label);letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:99px;white-space:nowrap}
.good{background:var(--good-t);color:var(--good)} .warn{background:var(--warn-t);color:var(--warn)} .crit{background:var(--crit-t);color:var(--crit)} .info{background:var(--info-t);color:var(--info)} .idle{background:var(--idle-t);color:var(--mute)}
.lbl{font:700 10px var(--label);letter-spacing:.06em;padding:1px 7px;border-radius:4px;margin-right:6px;white-space:nowrap}
.row{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.mute{color:var(--mute);font-size:12.5px}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 10.5px var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.btn{font:600 12px var(--label);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;min-height:32px}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.55;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1 1 260px;min-width:0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px;margin-top:10px}
.form label,.fl{font:600 10.5px var(--label);letter-spacing:.05em;text-transform:uppercase;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.in,select,textarea{font:500 13px var(--sans);padding:6px 8px;border:1px solid #8E929B;border-radius:6px;background:var(--surface);color:var(--ink);width:100%;max-width:100%}
textarea{min-height:70px;resize:vertical}
input[type=color]{padding:0;height:34px;width:60px}
input[type=file]{font-size:12.5px;max-width:100%}
.steps{display:flex;flex-direction:column}
.stp{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.stp:last-child{border-bottom:0}
.stp .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font:700 12px var(--label)}
.stp.miss .n{background:var(--warn-t);color:var(--warn)}
.stp.later .n{background:var(--idle-t);color:var(--mute)}
.stp .act{grid-column:2 / 4}
@media(max-width:600px){.stp{grid-template-columns:30px minmax(0,1fr)}.stp>.st{grid-column:2}}
.subnav{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 16px}
.subnav button{font:600 12px var(--label);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.subnav button[aria-current=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:13px;margin:0}
.kv dt{color:var(--mute)} .kv dd{margin:0;overflow-wrap:anywhere}
.rolechip{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--info-t);color:var(--info);border-radius:99px;padding:1px 4px 1px 9px;margin:2px 4px 2px 0}
.rolechip button{border:0;background:none;color:inherit;cursor:pointer;font-weight:700;padding:0 5px;min-height:0}
.pre{white-space:pre-wrap;font:12.5px/1.45 ui-monospace,Menlo,monospace;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:260px;overflow:auto}
.sop section{margin-bottom:18px} .sop h4{margin:4px 0 6px;font:700 15.5px var(--serif)} .sop h5{font:600 12.5px var(--label);margin:12px 0 4px} .sop p,.sop li{max-width:78ch} .sop li{margin-bottom:4px}
.sop .sop-title{font:700 19px var(--serif);letter-spacing:0;text-transform:none;color:var(--ink);margin:0 0 4px}
.sop .sop-lede{color:var(--ink2);font-size:14.5px;margin:0 0 14px}
.sop a{color:var(--info)}
.sop .tw{margin:8px 0 10px}
.sopnav{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.sopnav button{width:100%;text-align:left;font:600 12.5px var(--label);background:none;border:0;border-left:3px solid transparent;color:var(--ink2);padding:6px 10px;cursor:pointer;border-radius:0 6px 6px 0}
.sopnav button[aria-current=true]{border-left-color:var(--red);color:var(--ink);background:var(--surface2)}
.sopnav .sub button{padding-left:24px;font-weight:500}
.soplayout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:760px){.soplayout{grid-template-columns:1fr}}
.thread{margin:12px 0;padding:0}
.thread figcaption{font:600 13.5px var(--label);margin-bottom:8px}
.thread ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.thread li{position:relative;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface);max-width:none}
.thread li b{display:block;font:600 14px var(--label)}
.thread li span{color:var(--ink2);font-size:13px}
.thread li em{position:absolute;top:8px;right:12px;font:500 11.5px var(--label);font-style:normal;color:var(--mute)}
.thread li i{position:absolute;left:calc(50% + 12px);bottom:-17px;font:500 11.5px var(--sans);font-style:normal;color:var(--mute)}
.thread li:not(:last-child)::after{content:"";position:absolute;left:50%;bottom:-17px;height:15px;border-left:1.5px solid var(--mute)}
.thread li.main{border:2px solid var(--info);background:var(--info-t)}
.msg{font-size:13px;margin-top:8px}
.msg.err{color:var(--crit)} .msg.ok{color:var(--good)}
footer{color:var(--mute);font-size:12px}
footer .bad{color:var(--crit);font-weight:600}
.firstrun{max-width:760px}
.statement{font:600 17px/1.45 var(--serif);max-width:62ch;margin:6px 0}
.sc3{display:inline-grid;place-items:center;min-width:44px;height:24px;border-radius:99px;font:700 11.5px var(--label);padding:0 10px}
.sc3.good{background:var(--good-t);color:var(--good)}.sc3.warn{background:var(--warn-t);color:var(--warn)}.sc3.crit{background:var(--crit-t);color:var(--crit)}.sc3.idle{background:var(--idle-t);color:var(--mute)}
.bar{height:8px;background:var(--idle-t);border-radius:99px;margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.flow{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:22px}
.flow li{position:relative;min-width:0;display:flex}
.flow li:not(:last-child)::after{content:"";position:absolute;right:-18px;top:50%;width:14px;height:14px;border-top:2px solid var(--mute);border-right:2px solid var(--mute);transform:translateY(-50%) rotate(45deg)}
.fnode{width:100%;text-align:left;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.fnode:hover{border-color:var(--blue)}
.fnode .fstage{font:600 10px var(--label);letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.fnode .fn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--idle-t);color:var(--ink);font:700 12px var(--label)}
.fnode b{font:600 13.5px var(--label)}
.fnode .fwhat{font-size:12px;color:var(--ink2)}
.fnode .fstat{font-size:12px;color:var(--ink2);margin-top:auto}
.fnode.done{border-color:var(--good)}.fnode.done .fn{background:var(--good);color:#fff}
.fnode.draft{border-color:var(--warn)}.fnode.draft .fn{background:var(--warn-t);color:var(--warn)}
.fnode.next{border:2px solid var(--navy);box-shadow:var(--shadow)}.fnode.next .fn{background:var(--navy);color:#fff}
:root[data-theme="dark"] .fnode.next{border-color:var(--info)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fnode.next{border-color:var(--info)}}
.fnode .fnext{font:700 10.5px var(--label);letter-spacing:.05em;text-transform:uppercase;color:var(--red)}
.fnode.later{background:var(--surface2);border-style:dashed}
@media(max-width:980px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.flow li:not(:last-child)::after{display:none}}
@media(max-width:560px){.flow{grid-template-columns:1fr;gap:20px}.flow li:not(:last-child)::after{display:block;right:auto;left:50%;top:auto;bottom:-15px;transform:translateX(-50%) rotate(135deg)}}
.flowbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:14px;background:var(--surface2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<body>
<div class="wrap">
  <header class="top" id="top">
    <div class="brandrow"><span id="logo-slot"></span><div><h1>Compass Lite</h1><div class="sub" id="top-sub">Strategy workspace</div></div></div>
    <div class="topright"><span class="pilot" id="pilot-badge" hidden>PILOT</span><span class="chip" id="chip" role="status" aria-live="polite" hidden></span></div>
  </header>
  <div id="banner-slot"></div>
  <nav class="tabs" role="tablist" id="tabs" aria-label="Main sections"></nav>
  <main id="view" tabindex="-1"><p class="mute">Loading your records…</p></main>
  <footer id="footer"></footer>
</div>

<!-- SOP: the in-page Policy, Process and Procedure set (mirrors "Compass Lite: Policy, Process and Procedure") plus the page guide that explains every feature. data-sop-version must equal APP_RELEASE.version (CL-1312). -->
<template id="sop-template" data-sop-version="0.2.0">
<article data-doc="explained" data-label="Your Strategy Explained">
  <h3 class="sop-title">Your Strategy Explained</h3>
  <p class="sop-lede">Your strategy exists to focus the business on the few things that matter most, and to show that everyday work serves them.</p>

  <section><h4>1. Why your strategy exists</h4>
    <p><b>Purpose.</b> Explain, in plain words, why you have a strategy and what it is for.</p>
    <p><b>Summary.</b> A business always has more good ideas than time, people or money. A strategy is the set of choices that decides which ideas get your effort and which do not. BSIP, the Business Strategy and Implementation Process, builds those choices from evidence rather than instinct, tests them against who you are as a business, and turns them into a handful of goals you can track. Compass Lite then keeps the strategy alive after launch, so it is checked on a rhythm and not filed away.</p>
    <p><b>Output / value.</b> A strategy you can explain in a few minutes, that your team can follow and that you can measure.</p></section>

  <section><h4>2. The BSIP approach</h4>
    <p><b>Purpose.</b> Show how evidence becomes goals and action.</p>
    <p><b>Summary.</b> BSIP has seven stages: Environmental Scan, Internal Analysis, Strategic Direction, Goals and Objectives, Strategic Roadmap, BSIP Release and Implementation. Compass Lite builds Stages 3 to 5 and then manages the result. It does not repeat Stages 1 and 2. It starts from your evidence: your ACES Analysis (what you want to Achieve, Conserve, Eliminate and Start) and your Strategy Statement. You can build both in Lite from scratch, following the flow on the Dashboard, or bring them in an Intake Pack from Chart's facilitated discussion (Phase 2). The communication campaign and full implementation programme of Stages 6 and 7 sit outside Lite.</p>
    <div class="tw" tabindex="0" role="region" aria-label="BSIP stages in Compass Lite"><table><thead><tr><th>Stage</th><th>The question it answers</th><th>What you get</th></tr></thead><tbody>
      <tr><td>3 Strategic Direction</td><td>Where will we compete, how will we win, and does that fit who we are?</td><td>A Strategy Statement, strategic themes, a Mission, Vision and Values check, and AI ethics alignment</td></tr>
      <tr><td>4 Goals and Objectives</td><td>What are the few goals that matter most?</td><td>WIGs (Wildly Important Goals), objectives with owners and dates, measures, and a trace from every document back to its goal</td></tr>
      <tr><td>5 Strategic Roadmap</td><td>In what order, and who does what?</td><td>A three-phase roadmap, milestones, responsibilities and thresholds for your key indicators</td></tr>
      <tr><td>After launch</td><td>Is it working?</td><td>Weekly, monthly and quarterly reviews, and a clean handover when a goal is achieved</td></tr>
    </tbody></table></div>
    <p><b>Strategy proposes, identity constrains.</b> The Strategy Statement is drawn from the evidence. Your Mission, Vision, Values and AI ethical principles then test it. A choice that fails the test goes back to you. It is never quietly rewritten, and your values are never quietly bent to fit the strategy.</p>
    <p><b>Output / value.</b> You can see where each piece of your strategy came from and why it is there.</p></section>

  <section><h4>3. The stages Compass Lite leaves out</h4>
    <p><b>Purpose.</b> Be clear about what Compass Lite does not do, why, and where to go if you need it.</p>
    <p><b>Summary.</b> Compass Lite is built for small and mid-sized businesses, run directly by the owner, and sized to get you to a working strategy quickly. To keep it that way, four of the seven BSIP stages are not part of Lite. In each case Lite does something lighter in their place, so you can still move forward.</p>
    <div class="tw" tabindex="0" role="region" aria-label="Stages Compass Lite leaves out"><table><thead><tr><th>Stage</th><th>What it does in full BSIP</th><th>Why Lite leaves it out</th><th>What Lite does instead</th></tr></thead><tbody>
      <tr><td>1 Environmental Scan</td><td>Builds a full picture of the outside world around your business</td><td>A complete scan is a larger piece of work than an owner-run, quick-to-start tool is meant to carry</td><td>Starts from your ACES Analysis and Client Intake. With your permission, researches best practice on the web and marks it unverified until you confirm</td></tr>
      <tr><td>2 Internal Analysis</td><td>Looks honestly at the business inside: strengths, gaps and capability</td><td>A full internal analysis needs deeper fact-finding than Lite is sized for</td><td>Takes what you say about the business in the Client Intake and your website address, and checks every draft against your own Mission, Vision and Values</td></tr>
      <tr><td>6 BSIP Release</td><td>Communicates the strategy across the business through campaigns</td><td>Communication campaigns are outside Lite's scope</td><td>Produces a short progress update and client-ready exports you can share yourself</td></tr>
      <tr><td>7 Implementation</td><td>Delivers the plan through a full programme with project management</td><td>A full implementation programme with a PMO is outside Lite's scope, and Lite does not run your scoreboard or project tools</td><td>Manages the strategy once it is live: weekly, monthly and quarterly reviews, with WIGs and risks tracked</td></tr>
    </tbody></table></div>
    <p><b>Where to go for the full version.</b> Compass is planned as three levels, and Lite is Level 1. The full BSIP, with all seven stages, is the fuller route and is proposed as Compass Level 2. Level 3 is proposed to bring in Helm AI. Both are still proposals, so ask SpecNav (specnav.global) where they stand. You are likely to want the full version if you need a deeper outside-in scan, a thorough internal analysis, a company-wide communication campaign, or a managed implementation programme.</p>
    <p><b>What Lite does when you need a missing stage.</b> It tells you plainly that the stage is not part of Lite and points you to SpecNav for the full BSIP route. It does not improvise the stage or present a partial one as complete.</p>
    <p><b>Output / value.</b> You know exactly what Lite covers, why the rest is left out, and where to go when your business is ready for more.</p></section>

  <section><h4>4. The parts of your strategy</h4>
    <p><b>Purpose.</b> Show what each part is and why it exists.</p>
    <p><b>Summary.</b> Every part has one job. Together they form a golden thread: every document, initiative and measure cites the WIG it serves, and every WIG cites its reason for being.</p>
    <figure class="thread" aria-label="The golden thread: every part of your strategy traces back to evidence and forward to a review">
      <figcaption>Every part of your strategy traces back to evidence and forward to a review</figcaption>
      <ol>
        <li><b>Evidence</b><span>Start from facts: your ACES Analysis and Client Intake</span></li>
        <li><b>Strategy Statement</b><span>The choice: where to play, how to win, what not to do</span></li>
        <li><b>Mission, Vision, Values and AI ethics</b><span>The test: strategy proposes, identity constrains</span></li>
        <li><b>Strategic themes</b><span>Growth, Efficiency, Innovation and Risk mitigation</span></li>
        <li class="main"><b>WIGs</b><span>The few goals that matter most: at most four per level</span></li>
        <li><b>Objectives and measures</b><span>Steps with owners, dates, lead and lag measures</span></li>
        <li><b>Roadmap</b><span>Float, Move and Sustain: what comes in which order</span></li>
        <li><b>Reviews</b><span>Weekly, monthly and quarterly: is it working?</span></li>
      </ol>
    </figure>
    <p>Read top to bottom. Each part exists because of the one above it, and the reviews feed what you learn into the next round of evidence.</p>
    <div class="tw" tabindex="0" role="region" aria-label="The parts of your strategy"><table><thead><tr><th>Part</th><th>What it is</th><th>Why it exists</th></tr></thead><tbody>
      <tr><td>Strategy Statement</td><td>Your choice: who you serve, the problem you solve, what sets you apart and the trade-offs you accept</td><td>So everyone knows where you will compete, how you will win and what you will not do</td></tr>
      <tr><td>Mission, Vision, Values and AI ethical principles</td><td>Why you exist, where you are heading, how you behave and the boundaries on AI use</td><td>To keep the strategy honest. They test the Strategy Statement, and you decide any conflict</td></tr>
      <tr><td>Strategic themes</td><td>Growth, Efficiency, Innovation and Risk mitigation</td><td>To group what the evidence says and give each WIG a home</td></tr>
      <tr><td>WIGs</td><td>The few goals that matter most, written From X to Y by when</td><td>To focus your effort. Section 5 explains them</td></tr>
      <tr><td>Objectives</td><td>The steps that deliver a WIG, each with an owner, a date and measures</td><td>To turn a goal into work someone is accountable for</td></tr>
      <tr><td>Measures</td><td>Lead measures (actions you control), lag measures (the result), KPIs (how well it is going) and KRIs (early warnings)</td><td>To show whether it is working while you can still act</td></tr>
      <tr><td>Roadmap</td><td>Three phases. Float stabilises the business and lays foundations, including controlled AI pilots. Move drives efficiency, automation and growth. Sustain optimises, innovates and builds lasting advantage</td><td>To put the goals in order</td></tr>
      <tr><td>AI use cases</td><td>Specific uses of AI, each tied to a WIG and assessed in AEGIS Essentials</td><td>So AI serves the strategy and never the other way round</td></tr>
      <tr><td>Reviews</td><td>Weekly, monthly and quarterly checks</td><td>To keep the strategy current. <a href="#" data-act="sopDoc" data-arg="p1">P1</a> sets them out</td></tr>
    </tbody></table></div>
    <p><b>Output / value.</b> One clear line from your evidence to your goals to your daily work.</p></section>

  <section><h4>5. WIGs: the goals that matter most</h4>
    <p><b>Purpose.</b> Explain what a WIG is and why you have so few.</p>
    <p><b>Summary.</b> A WIG is the centre of the strategy. Compass Lite uses the 4DX approach (the Four Disciplines of Execution) to keep WIGs few, measured and reviewed.</p>
    <h5>What a WIG is</h5>
    <p>A WIG is a Wildly Important Goal: a goal so important that missing it would make other successes matter little. It is written as From X to Y by when. For example, From 12 repeat clients to 20 by 31 December. Each WIG has a lag measure, which is the result (X to Y), and lead measures, which are the actions you control that move the result. Lite runs a SMART check on every WIG before you confirm it.</p>
    <h5>Why there are at most four</h5>
    <p>The first discipline of 4DX is to focus on the wildly important. The idea is simple: the more goals you chase at once, the less energy each one gets, and a small team can only keep a few goals in view. Compass Lite sets a ceiling of four WIGs at any level, and many small businesses will do better with fewer. Lite flags more than four active WIGs as a risk, because too many goals is a common reason strategies stall. Everything else you do still matters. It simply is not a WIG.</p>
    <h5>How Lite applies the four disciplines</h5>
    <div class="tw" tabindex="0" role="region" aria-label="The four disciplines"><table><thead><tr><th>Discipline</th><th>What it means</th><th>Where you see it</th></tr></thead><tbody>
      <tr><td>1 Focus on the wildly important</td><td>Work on a few goals, not everything</td><td>At most four WIGs per level, with a four-slot WIG view</td></tr>
      <tr><td>2 Act on the lead measures</td><td>Track the actions you control, not only the result</td><td>Every objective carries lead and lag measures</td></tr>
      <tr><td>3 Keep a compelling scoreboard</td><td>Everyone can see whether you are winning</td><td>The Dashboard and the scoreboard definition</td></tr>
      <tr><td>4 Create a cadence of accountability</td><td>Short, regular check-ins</td><td>Weekly, monthly and quarterly reviews (<a href="#" data-act="sopDoc" data-arg="p1">P1</a>)</td></tr>
    </tbody></table></div>
    <p>When a WIG is achieved, it is closed out properly (<a href="#" data-act="sopDoc" data-arg="p2">P2</a>). That frees its slot, and the next WIG is chosen from the ranked backlog.</p>
    <p><b>Output / value.</b> You know what a WIG is, why the number is capped, and how the reviews keep each one moving.</p></section>
</article>

<article data-doc="policy" data-label="Compass Lite Policy">
  <h3 class="sop-title">Compass Lite: Strategy Management Policy</h3>
  <p class="sop-lede">We manage our strategy on a set rhythm. Compass Lite drafts, checks and tracks. People decide.</p>

  <section><h4>1. Purpose and scope</h4>
    <p><b>Purpose.</b> Set the rules for managing a strategy built with Compass Lite, so goals stay current, evidenced and in step with AEGIS Essentials.</p>
    <p><b>Summary.</b> This policy covers the strategy Lite builds from BSIP Stages 3 to 5 (Strategy Statement, WIGs, objectives and roadmap) and how it is managed after launch. It follows the AEGIS Essentials layout: a policy, annexes and procedures. The policy says <i>what</i> must happen. The annexes hold the detail and the procedures say <i>how</i>. Lite hands its AI use case list to AEGIS Essentials, where each use case is assessed. Stage 1 and 2 analysis, Stage 6 communication and running your scoreboard are out of scope. <a href="#" data-act="sopDoc" data-arg="explained">Your Strategy Explained</a>, section 3, says why and where to go for them.</p>
    <p><b>New to the approach?</b> Start with <a href="#" data-act="sopDoc" data-arg="explained">Your Strategy Explained</a>. It explains why your strategy exists, what each part is, and what a WIG is and why there are at most four.</p>
    <figure class="thread tiers" aria-label="Policy sets the rules, annexes hold the detail, procedures set the steps">
      <figcaption>Policy sets the rules, annexes hold the detail, procedures set the steps</figcaption>
      <ol>
        <li><b>Policy</b> <em>SN-CMP-POL-01</em><span>What: eight principles, eleven rules, scales, roles and review</span><i>is detailed in</i></li>
        <li><b>Annexes</b> <em>Annexes A to C</em><span>Detail: cadence calendar, records, AEGIS handoff, escalation signals</span><i>is put into practice by</i></li>
        <li class="main"><b>Procedure</b> <em>P1 to P3</em><span>How: stages with a trigger, steps, output and check</span><i>writes to and reads from</i></li>
        <li><b>Records</b> <em>Six records</em><span>Evidence: what every review reads and writes</span></li>
      </ol>
    </figure>
    <div class="tw" tabindex="0" role="region" aria-label="Parts of the policy"><table><thead><tr><th>Part</th><th>What it holds</th></tr></thead><tbody>
      <tr><td>This policy</td><td>Principles, rules, scales, roles, exceptions and review</td></tr>
      <tr><td><a href="#" data-act="sopDoc" data-arg="annex-a">Annex A · Cadence Calendar</a></td><td>The review rhythm, who joins and what each review reads</td></tr>
      <tr><td><a href="#" data-act="sopDoc" data-arg="annex-b">Annex B · Records and AEGIS Handoff</a></td><td>The registers, and how Lite output moves into AEGIS Essentials</td></tr>
      <tr><td><a href="#" data-act="sopDoc" data-arg="annex-c">Annex C · Escalation Signals</a></td><td>Signals that need a decision, and who decides</td></tr>
      <tr><td><a href="#" data-act="sopDoc" data-arg="p1">P1 · Review Cadence</a></td><td>Session open check, weekly, monthly and quarterly reviews</td></tr>
      <tr><td><a href="#" data-act="sopDoc" data-arg="p2">P2 · WIG Turnover</a></td><td>Completing a WIG, close-out decisions and choosing the next WIG</td></tr>
      <tr><td><a href="#" data-act="sopDoc" data-arg="p3">P3 · Set-up and Snapshot</a></td><td>First-run set-up and the facilitator snapshot</td></tr>
    </tbody></table></div>
    <p><b>Output / value.</b> One map of how your strategy is governed day to day, traceable from a rule to a routine to a record.</p></section>

  <section><h4>2. Principles</h4>
    <ol>
      <li><b>Strategy first.</b> Every objective traces to a WIG, and every WIG to the Strategy Statement. Lite proposes an AI use case only when a WIG calls for it. AI is a means to the strategy, never a goal in itself. When a WIG is achieved, AI that is now part of how we work moves to Run The Business: still governed, but no longer counted as strategy work.</li>
      <li><b>A person is always accountable.</b> Every WIG, objective, risk and decision has one named owner.</li>
      <li><b>Humans decide.</b> Lite may draft, suggest and summarise. Every goal, score, treatment and decision is a suggestion until a person confirms it.</li>
      <li><b>Evidence before investment.</b> Reviews use only figures held in the registers. A missing figure shows as Not recorded and is never estimated.</li>
      <li><b>True to who we are.</b> Every draft is tested against our Mission, Vision, Values and AI ethical principles. Lite never decides them.</li>
      <li><b>Our data stays ours.</b> Our records live in our own Compass Lite page, under our own Claude account, and our backups sit in our own cloud storage. No client data goes to SpecNav, and web research never carries it.</li>
      <li><b>Proportionate.</b> Light touch for low-risk items; more checks as risk rises. Sized for a small business.</li>
      <li><b>Finish before moving on.</b> A WIG completes only when every objective under it is Completed or Cancelled.</li>
    </ol>
    <p>Together these apply the AEGIS Essentials principles of strategy first, a named accountable person, human decisions and proportionate control to the work of managing a strategy.</p></section>

  <section><h4>3. The rules</h4>
    <h5>Everyone must</h5>
    <ul>
      <li>Confirm each Lite draft before it is recorded, and check any Lite output before it leaves the business or is relied on.</li>
      <li>Link every objective to a WIG, and every AI use case to a WIG or objective, before it is put forward.</li>
      <li>Take each AI use case Lite proposes through AEGIS Essentials P1 before relying on AI for a business process. Take any need for a stage Lite leaves out (a full external scan, internal analysis, communication campaign or implementation programme) to SpecNav for the full BSIP route, and do not ask Lite to improvise it.</li>
      <li>Keep the WIG Register, KPI and KRI Register, Milestone Plan, Risk Register and Decision Log current, and hold reviews on the cadence in section 4.</li>
      <li>Report a Lite error, near miss or concern to the AI Governance Lead within 1 working day, at once if serious.</li>
    </ul>
    <h5>Everyone must not</h5>
    <ul>
      <li>Treat a Lite draft as a decision.</li>
      <li>Put data into Lite above its approved data level (ceiling L3, L5 always refused), or use a personal account for business data.</li>
      <li>Let Lite send, publish or change a record without a person's confirmation.</li>
      <li>Keep relying on AI for a process that no longer supports a current WIG or objective, unless it has moved to Run The Business through a WIG close-out (<a href="#" data-act="sopDoc" data-arg="p2">P2</a>).</li>
      <li>Run more than four WIGs at any level, or complete a WIG while an objective under it is still open.</li>
      <li>Edit or replace reference data, such as the AEGIS Master Categories and Scoring, outside a new release of Compass Lite.</li>
    </ul>
    <p><b>Output / value.</b> Eleven plain rules that anyone helping run the strategy can follow.</p></section>

  <section><h4>4. How the strategy is managed</h4>
    <p><b>Purpose.</b> Show the cadence that keeps your strategy current.</p>
    <p><b>Summary.</b> Seven routines run on four rhythms: once, every session, on a regular cycle, and when something happens. Weekly, monthly and quarterly frequencies are starting defaults to confirm at set-up. The quarterly review matches the AEGIS Essentials Quarterly Governance Review, every 90 days by default. <a href="#" data-act="sopDoc" data-arg="annex-a">Annex A</a> holds the calendar.</p>
    <div class="tw" tabindex="0" role="region" aria-label="Routines"><table><thead><tr><th>Routine</th><th>Procedure</th><th>Runs</th><th>You get</th></tr></thead><tbody>
      <tr><td>Set up</td><td>P3</td><td>Once, then while skipped steps remain</td><td>Saving checked, roles, website address, cadence and data limits confirmed</td></tr>
      <tr><td>Session open check</td><td>P1</td><td>Every session</td><td>A readout of stale entries, overdue reviews and risk indicators</td></tr>
      <tr><td>Weekly progress check</td><td>P1</td><td>Weekly</td><td>Each WIG's status and percent complete, up to date</td></tr>
      <tr><td>Monthly review</td><td>P1</td><td>Monthly</td><td>A short progress update you can share</td></tr>
      <tr><td>Quarterly strategy review</td><td>P1</td><td>Every 90 days by default</td><td>Strategy, values fit and WIGs retested, with decisions logged</td></tr>
      <tr><td>WIG turnover</td><td>P2</td><td>When a WIG is achieved</td><td>The result archived, close-out decisions made, the next WIG chosen</td></tr>
      <tr><td>Facilitator snapshot</td><td>P3</td><td>On request</td><td>An Excel status snapshot for your retained facilitator</td></tr>
    </tbody></table></div>
    <p><b>Output / value.</b> A small, predictable routine. Nothing drifts for months before anyone notices.</p></section>

  <section><h4>5. How we measure</h4>
    <p><b>Purpose.</b> Give every score one scale, so a Compass Lite reading and an AEGIS Essentials reading mean the same thing.</p>
    <p><b>Summary.</b> Lite uses the AEGIS Essentials scales. The details sit in the AEGIS Essentials annexes, and Lite carries the Master Categories and Scoring as read-only reference data, labelled Template.</p>
    <div class="tw" tabindex="0" role="region" aria-label="Scales"><table><thead><tr><th>Scale</th><th>In one line</th><th>Details</th></tr></thead><tbody>
      <tr><td>Strategic alignment</td><td>Every objective traces to a WIG; every AI use case links to a WIG or objective. No link, no approval</td><td>AEGIS Essentials Annex E</td></tr>
      <tr><td>Risk</td><td>Likelihood × Impact (1 to 25), banded Low 1 to 5, Medium 6 to 10, High 11 to 15, Critical 16 to 25. The band sets who approves</td><td>AEGIS Essentials Annex B</td></tr>
      <tr><td>Data</td><td>Five levels, L1 Public to L5 Critical. Lite's ceiling is L3 and L5 is always refused</td><td>AEGIS Essentials Annex C</td></tr>
      <tr><td>Key risk indicators</td><td>Ten indicators read from the registers, each with threshold, trend and source. No data shows as Not recorded</td><td>AEGIS Essentials Annex B</td></tr>
      <tr><td>Incident priority</td><td>P0 (drop everything) to P4 (cosmetic)</td><td>AEGIS Essentials Annex D</td></tr>
    </tbody></table></div>
    <p><b>Who approves.</b> Low risk, the BU Lead. Medium, the AI Governance Lead. High, the Executive Sponsor. Critical cannot proceed until treated. Tolerating a High or Critical risk needs a recorded reason and flags the Executive Sponsor.</p>
    <p><b>Output / value.</b> Fair, comparable scores, and nothing recorded without a person's confirmation.</p></section>

  <section><h4>6. Roles</h4>
    <p><b>Purpose.</b> Make sure every step has a named person.</p>
    <p><b>Summary.</b> Six roles, as in AEGIS Essentials. In a small business one person often holds several, and the Owner or MD is usually the Executive Sponsor. Every WIG, objective and risk has one named owner. You record who holds each role on Set-up, Organization.</p>
    <div class="tw" tabindex="0" role="region" aria-label="Roles"><table><thead><tr><th>Role</th><th>Typical holder</th><th>Accountable for</th></tr></thead><tbody>
      <tr><td>Executive Sponsor</td><td>Owner / MD</td><td>The Strategy Statement, WIGs and objectives; this policy; High-risk decisions; approving moves to Run The Business; the quarterly review</td></tr>
      <tr><td>AI Governance Lead</td><td>Ops lead or fractional AI advisor</td><td>Running P1 to P3 and the registers; Medium-risk decisions; rating incidents</td></tr>
      <tr><td>DPO (Data Protection)</td><td>Owner, ops lead or outside adviser</td><td>Data levels and Lite's data ceiling</td></tr>
      <tr><td>IT or Security Lead</td><td>In-house IT or managed service provider</td><td>Access to the Compass Lite page, and where its backups are kept</td></tr>
      <tr><td>BU Lead</td><td>Head of each function</td><td>The objectives they own; Low-risk decisions</td></tr>
      <tr><td>End User</td><td>All staff</td><td>Following the rules; raising ideas and concerns</td></tr>
    </tbody></table></div>
    <p>Two supporting parties are not roles. A retained facilitator, if you have one, receives the status snapshot you choose to send, or is invited to the page by you. Lite drafts, checks and tracks. It never decides, sends or edits reference data.</p>
    <p><b>Output / value.</b> No orphan goals, no unowned risks.</p></section>

  <section><h4>7. Exceptions and incidents</h4>
    <p><b>Exceptions.</b> Only the Executive Sponsor can grant one. It must be written, limited to 90 days, and logged in the Decision Log. There is no exception to the strategy link for an objective or an AI use case.</p>
    <p><b>Incidents.</b> Report to the AI Governance Lead, who rates the incident P0 to P4. The Executive Sponsor decides on containment and client notification for P0 and P1. Honest, prompt reporting is never treated as misconduct.</p></section>

  <section><h4>8. Review and document control</h4>
    <p><b>Quarterly Strategy Review.</b> The Executive Sponsor reviews the WIG Register, Milestone Plan, Risk Register, risk indicators and Decision Log, together with anything Lite has flagged. <a href="#" data-act="sopDoc" data-arg="p1">P1</a> sets out the steps.</p>
    <div class="tw" tabindex="0" role="region" aria-label="Document control"><table><thead><tr><th>Control</th><th>Detail</th></tr></thead><tbody>
      <tr><td>Document ID</td><td>SN-CMP-POL-01 (proposed)</td></tr>
      <tr><td>Version</td><td>0.1 (draft), shared by the policy, annexes and procedures</td></tr>
      <tr><td>Owner</td><td>Executive Sponsor</td></tr>
      <tr><td>Review</td><td>Every 12 months, after a P0 incident, when AEGIS risk scoring changes, or when WIGs are reset</td></tr>
      <tr><td>This in-page copy</td><td>Carried in the Compass Lite file and checked against the release that is running (see the header above)</td></tr>
    </tbody></table></div>
    <div class="tw" tabindex="0" role="region" aria-label="Version history"><table><thead><tr><th>Version</th><th>Date</th><th>Change</th></tr></thead><tbody>
      <tr><td>0.1</td><td>2026-10-04</td><td>First draft, realigned to the AEGIS Essentials policy structure (policy, annexes, procedures, numbered sections, roles, review and document control)</td></tr>
    </tbody></table></div>
    <p><b>Still to confirm.</b> Weekly, monthly and quarterly frequencies and depth are defaults from the Compass Lite specification. Whether the business owner or a SpecNav consultant runs Lite also remains open, and it sets who confirms each step.</p></section>

  <section><h4>9. Using your strategy with your team and others</h4>
    <p><b>Purpose.</b> Make sure the strategy is lived by the whole team, kept current from real figures, improved by what you learn, and shown to others when it helps.</p>
    <p><b>Summary.</b> Five practices extend the policy beyond the owner. Each one keeps the same rule as everything else in Lite: Lite drafts, a person confirms, and nothing is sent or shared without you.</p>
    <div class="tw" tabindex="0" role="region" aria-label="Practices"><table><thead><tr><th>Practice</th><th>What we do</th><th>Rule</th></tr></thead><tbody>
      <tr><td>Start small</td><td>Reach a first confirmed goal in one sitting by following the flow on the Dashboard: ACES, Strategy Statement, Mission, Vision and Values, then a first WIG. The quick start and starter library arrive in Phase 3. Deferred set-up steps stay on the open list.</td><td>Skipped is never the same as done.</td></tr>
      <tr><td>Weekly team rhythm <span class="pill idle" data-arrives="5">Arrives in P5</span></td><td>Hold a 15-minute weekly meeting. Each person makes one commitment linked to an objective. Review last week's commitments first.</td><td>Commitments record follow-through. They are not a score for people.</td></tr>
      <tr><td>Use real figures <span class="pill idle" data-arrives="8">Arrives in P8</span></td><td>Where tools are connected, measures update from them, with the source and date shown.</td><td>Read-only. Only totals are kept, never customer records. A missing figure stays Not recorded.</td></tr>
      <tr><td>Learn from results <span class="pill idle" data-arrives="5">Arrives in P5</span></td><td>Record a forecast and its key assumption for each goal. Compare with the result when the goal is reviewed or archived.</td><td>Learning is about our forecasting, not about individuals.</td></tr>
      <tr><td>Show your governance <span class="pill idle" data-arrives="7">Arrives in P7</span></td><td>Prepare an assurance pack, or answer a supplier questionnaire, from the registers.</td><td>The owner chooses what is included and confirms every answer. Lite never claims a certification you do not hold, and never sends.</td></tr>
    </tbody></table></div>
    <p><b>Benchmarks.</b> Anonymous, numbers-only benchmarks are optional and off by default. If you turn them on, you see exactly what would be shared first, and you can stop at any time. No names, figures, customers or documents are ever shared.</p>
    <p><b>Output / value.</b> A strategy the whole team follows, current figures, better forecasts over time, and evidence you can show a lender, insurer or customer.</p></section>
</article>

<article data-doc="annex-a" data-label="Annex A · Cadence Calendar" data-parent="policy">

  <p><b>Purpose.</b> Put the whole review rhythm on one page. <b>Used by.</b> Policy section 4, P1, P2, P3. <b>Value.</b> You know what is due and who needs to be in the room.</p>
  <div class="tw" tabindex="0" role="region" aria-label="Cadence calendar"><table><thead><tr><th>Rhythm</th><th>Procedure</th><th>Proposed attendees</th><th>Reads</th><th>You leave with</th></tr></thead><tbody>
    <tr><td>Once</td><td>P3 Stage 1</td><td>Executive Sponsor, AI Governance Lead</td><td>Intake Pack, your website address, Risk Management Policy if you have one</td><td>Set-up with each step Set, Skipped or Not applicable</td></tr>
    <tr><td>Every session</td><td>P1 Stage 1</td><td>Whoever opens Lite</td><td>All registers, release and SOP versions</td><td>A one-screen readout</td></tr>

    <tr><td>Monthly</td><td>P1 Stage 3</td><td>Executive Sponsor, BU Leads</td><td>Weekly picture, KPI and KRI Register, Decision Log</td><td>A short progress update</td></tr>
    <tr><td>Every 90 days by default</td><td>P1 Stage 4</td><td>Executive Sponsor, AI Governance Lead</td><td>All registers, including the Risk Register</td><td>Retested strategy, decisions logged</td></tr>
